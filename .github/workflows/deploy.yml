name: Deploy to EC2

on:
  push:
    branches:
      - production

jobs:
  deploy_frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy Frontend to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
          cd Healthcare-AI-Chatbot
          git pull origin production
          cd frontend
          npm install
          npm run build
          # Check if the app is running and stop it if it is
          if pm2 list | grep -q "healthcare-ai-chatbot-app"; then
            pm2 stop healthcare-ai-chatbot-app
          fi
          pm2 start npm --name "healthcare-ai-chatbot-app" -- run start -- -H 0.0.0.0 -p 4000
          pm2 save
          EOF


  deploy_backend:
    runs-on: ubuntu-latest
    needs: deploy_frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy Backend to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
          cd Healthcare-AI-Chatbot
          git pull origin production
          cd backend
          source venv/bin/activate
          pip install -r requirements.txt
          python manage.py migrate
          # Check if the server is running and stop it
          if pgrep -f "manage.py runserver"; then
            pkill -f "manage.py runserver"
          fi
          # Start the server in the background and log output
          cd ..
          nohup export PYTHONPATH=. && python backend/manage.py runserver 0.0.0.0:8000 > backend.log 2>&1 &
          EOF
