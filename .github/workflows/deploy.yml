name: Deploy to EC2

on:
  push:
    branches:
      - production

jobs:
  deploy_frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy Frontend to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
          cd AI-Healthcare
          git pull origin production
          cd frontend
          npm install
          npm run build
          # Check if the app is running and stop it if it is
          if pm2 list | grep -q "aihealthcare-app"; then
            pm2 stop aihealthcare-app
          fi
          pm2 start npm --name "aihealthcare-app" -- run start -- -H 0.0.0.0 -p 4000
          pm2 save
          EOF


  deploy_backend:
    runs-on: ubuntu-latest
    needs: deploy_frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

 deploy_backend:
    runs-on: ubuntu-latest
    needs: deploy_frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

          deploy_backend:
            runs-on: ubuntu-latest
            needs: deploy_frontend
        
            steps:
              - name: Checkout code
                uses: actions/checkout@v2
        
              - name: Set up SSH
                uses: webfactory/ssh-agent@v0.5.3
                with:
                  ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
        
              - name: Deploy Backend to EC2
                run: |
                  ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
                  cd Healthcare-AI-Chatbot
                  git pull origin production
                  source backend/venv/bin/activate
                  pip install -r backend/requirements.txt
                  export PYTHONPATH=. && python backend/manage.py migrate
                  # Check if the app is running and stop it if it is
                  if pm2 list | grep -q "aihealthcare-backend"; then
                    pm2 stop aihealthcare-backend
                  fi
                  pm2 start python --name "aihealthcare-backend" -- backend/manage.py runserver 0.0.0.0:4001
                  pm2 save
                  EOF
